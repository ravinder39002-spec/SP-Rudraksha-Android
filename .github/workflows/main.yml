name: Build SP Rudraksha AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q SP_Rudraksha_Android_Fixed.zip -d build-src

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release AAB
        working-directory: build-src
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sp-rudraksha-release-aab
          path: build-src/app/build/outputs/bundle/release/*.aab
