name: Build SP Rudraksha AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf build-src
          mkdir -p build-src

          ZIP_FILE="./SP_Rudraksha_app.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d build-src

          echo "Android project extracted."
          find build-src -maxdepth 2 -type f | sort

      - name: Build Release AAB
        working-directory: build-src
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sp-rudraksha-release-aab
          path: build-src/app/build/outputs/bundle/release/*.aab
