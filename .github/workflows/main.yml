name: Build SP Rudraksha AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir build-src
          unzip -q "SP_Rudraksha_app.zip" -d build-src
          PROJECT_DIR=$(find build-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Release AAB
        run: |
          cd "$PROJECT_DIR"
          gradle :app:bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sp-rudraksha-release-aab
          path: build-src/**/app/build/outputs/bundle/release/*.aab
